<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Briefcase Control — Quiz Live</title>
<style>
  body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:#1e2235;color:#eee;min-height:100vh}
  .hidden{display:none!important}
  h1,h2,h3{margin:0 0 10px}
  .btn{background:#ff9d3b;color:#1e2235;border:none;padding:10px 18px;border-radius:6px;font-size:14px;font-weight:bold;cursor:pointer}
  .btn:hover{filter:brightness(1.1)}
  .btn.gray{background:#4a5175;color:#eee}
  .btn.danger{background:#d64545;color:#fff}
  .btn.green{background:#3fae6a;color:#fff}
  input,select,textarea{width:100%;padding:8px;border-radius:5px;border:1px solid #4a5175;background:#141728;color:#eee;font-size:14px;box-sizing:border-box}
  label{display:block;margin:8px 0 3px;font-size:12px;color:#9aa0c0;font-weight:bold}
  .status{font-size:12px;color:#3fae6a;font-weight:bold}

  /* ----- ROLE LOGIN (added feature, styled to match) ----- */
  #loginScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px}
  #loginScreen h1{font-size:30px}
  #loginScreen p{color:#9aa0c0}
  #adminPinBox,#playerNameBox{background:#262b45;padding:22px;border-radius:10px;width:320px}
  .roleBtns{display:flex;gap:14px}
  .roleBtns button{width:180px;padding:18px;font-size:16px}

  /* ----- ADMIN ----- */
  #adminApp header{background:#262b45;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
  #adminApp header .btns{display:flex;gap:8px;flex-wrap:wrap}
  #bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;padding:18px}
  .qcard{background:#262b45;border-radius:8px;padding:14px;border-left:4px solid #ff9d3b;cursor:pointer;position:relative}
  .qcard .type{font-size:11px;color:#ff9d3b;font-weight:bold;text-transform:uppercase}
  .qcard p{margin:6px 0 0;color:#9aa0c0;font-size:13px}
  .badge{position:absolute;top:10px;right:10px;font-size:11px;color:#3fae6a;font-weight:bold}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50}
  .modalBox{background:#262b45;padding:22px;border-radius:10px;width:420px;max-width:92vw;max-height:90vh;overflow:auto}
  .row{display:flex;gap:10px;margin-top:16px}

  /* ----- PLAYER ----- */
  #playerApp{max-width:640px;margin:0 auto;padding:20px}
  .panel{background:#262b45;border-radius:10px;padding:18px;margin-bottom:14px}
  .topbar{display:flex;justify-content:space-between;align-items:center}
  .timerBox{text-align:center;font-size:34px;font-weight:bold;color:#ff9d3b}
  .opt{display:block;width:100%;text-align:left;background:#141728;border:1px solid #4a5175;color:#eee;padding:12px;border-radius:6px;margin-bottom:8px;font-size:15px;cursor:pointer}
  .opt:hover{border-color:#ff9d3b}
  .opt.sel{border-color:#ff9d3b;background:#2a2418}
  .opt.correct{border-color:#3fae6a;background:#1a2e22}
  .opt.wrong{border-color:#d64545;background:#2e1a1a}
  .opt:disabled{cursor:not-allowed}
  #pTf{display:flex;gap:10px}
  #pTf .opt{text-align:center;font-weight:bold;margin:0}
  .correctBox{border:1px solid #3fae6a;border-radius:8px;padding:14px;margin-top:12px;background:#1a2e22}
  .pts{font-size:20px;font-weight:bold;color:#ff9d3b}
</style>
</head>
<body>

<!-- ========== ROLE SELECTION ========== -->
<div id="loginScreen">
  <h1>Briefcase Control</h1>
  <p>Select your role to continue.</p>
  <div class="roleBtns">
    <button class="btn" onclick="pickRole('admin')">💼 Host / Admin</button>
    <button class="btn green" onclick="pickRole('player')">🙋 Player</button>
  </div>

  <div id="adminPinBox" class="hidden">
    <h3>Admin Sign-In</h3>
    <p style="margin:0 0 8px">Enter the administrator code.</p>
    <input type="password" id="pinInput" placeholder="Admin code" style="text-align:center">
    <div class="row"><button class="btn" style="width:100%" onclick="verifyPin()">Sign In</button></div>
    <p id="pinErr" style="color:#d64545;display:none">Incorrect code. Try again.</p>
  </div>

  <div id="playerNameBox" class="hidden">
    <h3>Join the Quiz</h3>
    <p style="margin:0 0 8px">Enter your name to register for the live session.</p>
    <input id="playerName" placeholder="Your name">
    <div class="row"><button class="btn green" style="width:100%" onclick="joinAsPlayer()">Connect to Live</button></div>
  </div>
</div>

<!-- ========== ADMIN ========== -->
<div id="adminApp" class="hidden">
  <header>
    <div>
      <h2>Briefcase Control</h2>
      <span class="status">● SYSTEM LIVE</span>
    </div>
    <div class="btns">
      <button class="btn" onclick="openWizard()">➕ Add Question</button>
      <button class="btn green" onclick="revealAnswer()">👁 Reveal Answer</button>
      <button class="btn danger" onclick="wipeAll()">Wipe Grid &amp; All Storage Memory</button>
      <button class="btn gray" onclick="toggleFS()">⛶ Fullscreen</button>
    </div>
  </header>
  <div id="bank"></div>
</div>

<!-- Question Wizard -->
<div id="modal" class="hidden">
  <div class="modalBox">
    <h3 id="wizTitle">Question Wizard</h3>
    <label>Question Type</label>
    <select id="wType" onchange="wTypeChanged()">
      <option value="mc">Multiple Choice</option>
      <option value="tf">True or False</option>
      <option value="sa">Short Answer</option>
    </select>
    <label>Question Prompt</label>
    <textarea id="wQ" rows="2"></textarea>
    <div id="wMcFields">
      <label>Option A</label><input id="wA">
      <label>Option B</label><input id="wB">
      <label>Option C</label><input id="wC">
      <label>Option D</label><input id="wD">
      <label>Correct Answer</label>
      <select id="wCorrect"><option>A</option><option>B</option><option>C</option><option>D</option></select>
    </div>
    <div id="wTfFields" class="hidden">
      <label>Correct Answer</label>
      <select id="wTfCorrect"><option value="true">TRUE</option><option value="false">FALSE</option></select>
    </div>
    <div id="wSaFields" class="hidden">
      <label>Accepted Answer (case-insensitive)</label>
      <input id="wSa" placeholder="e.g. photosynthesis">
    </div>
    <div class="row">
      <div style="flex:1"><label>Points</label><input id="wPts" type="number" value="100"></div>
      <div style="flex:1"><label>Timer (Sec)</label><input id="wTimer" type="number" value="30"></div>
    </div>
    <div class="row">
      <button class="btn green" style="flex:1" onclick="saveQ()">Save to Question Bank</button>
      <button class="btn gray" onclick="closeModal()">Cancel &amp; Close</button>
    </div>
  </div>
</div>

<!-- ========== PLAYER ========== -->
<div id="playerApp" class="hidden">
  <div class="panel topbar">
    <div><span class="status" style="color:#9aa0c0">ACTIVE TEAM</span><h3 id="pName">—</h3></div>
    <div style="text-align:right"><span class="status" style="color:#9aa0c0">POINTS</span><div class="pts" id="pPts">0</div></div>
  </div>
  <div class="panel" style="text-align:center">
    <div class="status" style="color:#9aa0c0" id="pStatus">⏳ WAITING FOR QUESTION...</div>
    <div class="timerBox" id="pTimer">--</div>
  </div>
  <div class="panel hidden" id="qPanel">
    <span class="status" style="color:#ff9d3b" id="pType"></span>
    <h3 id="pQ"></h3>
    <!-- Multiple Choice -->
    <div id="pMc" class="hidden"></div>
    <!-- True or False -->
    <div id="pTf" class="hidden">
      <button class="opt" onclick="lockTf('true')">TRUE</button>
      <button class="opt" onclick="lockTf('false')">FALSE</button>
    </div>
    <!-- Short Answer -->
    <div id="pSa" class="hidden">
      <input id="saInput" placeholder="Type your answer...">
      <div class="row"><button class="btn green" style="width:100%" onclick="lockSa()">Lock In Answer</button></div>
    </div>
    <div id="pFeedback" class="hidden"><div class="correctBox" id="fbBox"></div></div>
  </div>
</div>

<script>
/* ============ SHARED STATE ============ */
const ADMIN_PIN = "110696"; // built-in admin code
const bc = ("BroadcastChannel" in window) ? new BroadcastChannel("quizLive") : null;
const store = {
  get bank(){ return JSON.parse(localStorage.getItem("quiz_bank")||"[]"); },
  set bank(v){ localStorage.setItem("quiz_bank", JSON.stringify(v)); },
  get live(){ return JSON.parse(localStorage.getItem("quiz_live")||"null"); },
  set live(v){ localStorage.setItem("quiz_live", JSON.stringify(v)); },
  get reveal(){ return localStorage.getItem("quiz_reveal")==="1"; },
  set reveal(v){ localStorage.setItem("quiz_reveal", v?"1":"0"); }
};
function emit(){ bc && bc.postMessage("sync"); }
if(bc) bc.onmessage = ()=>{ if(role==="admin") renderBank(); else if(role==="player") renderLive(); };

/* ============ ROLE LOGIN ============ */
let role = null;
function pickRole(r){
  if(r==="admin"){ document.getElementById("adminPinBox").classList.remove("hidden"); document.getElementById("pinInput").focus(); }
  else { document.getElementById("playerNameBox").classList.remove("hidden"); document.getElementById("playerName").focus(); }
}
function verifyPin(){
  if(document.getElementById("pinInput").value === ADMIN_PIN){ role="admin"; show("adminApp"); renderBank(); }
  else document.getElementById("pinErr").style.display="block";
}
function joinAsPlayer(){
  const n = document.getElementById("playerName").value.trim();
  if(!n) return alert("Please enter your name.");
  sessionStorage.setItem("quiz_player", n);
  role="player"; show("playerApp");
  document.getElementById("pName").textContent = n;
  renderLive();
}
function show(id){
  document.getElementById("loginScreen").classList.add("hidden");
  ["adminApp","playerApp"].forEach(a=>document.getElementById(a).classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}
document.getElementById("pinInput").addEventListener("keydown",e=>{if(e.key==="Enter")verifyPin();});
document.getElementById("playerName").addEventListener("keydown",e=>{if(e.key==="Enter")joinAsPlayer();});

/* ============ ADMIN ============ */
let editingIdx = null;
const TYPE_LABEL={mc:"Multiple Choice",tf:"True or False",sa:"Short Answer"};
function renderBank(){
  const bank = store.bank, el = document.getElementById("bank");
  if(!bank.length){ el.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:#9aa0c0;padding:40px"><h3>Your Quiz is Empty</h3>Click the <b>Add Question</b> button at the top to populate your dashboard.<br><br><i>Tip: right-click a saved question to Push Live (OK) or Delete (Cancel).</i></div>`; return; }
  el.innerHTML = bank.map((q,i)=>`
    <div class="qcard" onclick="openWizard(${i})">
      <span class="type">${TYPE_LABEL[q.type]}</span>
      <h3>${esc(q.q)}</h3>
      <p>${q.pts} pts • ${q.timer}s</p>
      ${q.sent?'<span class="badge">SENT ✓</span>':''}
    </div>`).join("");
}
function openWizard(i){
  editingIdx = (typeof i==="number") ? i : null;
  const q = editingIdx!==null ? store.bank[i] : null;
  document.getElementById("modal").classList.remove("hidden");
  document.getElementById("wizTitle").textContent = q ? "Edit Question" : "Question Wizard";
  if(q){
    wType.value=q.type; wQ.value=q.q; wPts.value=q.pts; wTimer.value=q.timer;
    if(q.type==="mc"){ wA.value=q.opts[0];wB.value=q.opts[1];wC.value=q.opts[2];wD.value=q.opts[3]; wCorrect.value=q.correct; }
    if(q.type==="tf") wTfCorrect.value=q.correct;
    if(q.type==="sa") wSa.value=q.correct;
  } else { ["wQ","wA","wB","wC","wD","wSa"].forEach(id=>document.getElementById(id).value=""); wPts.value=100; wTimer.value=30; }
  wTypeChanged();
}
function wTypeChanged(){
  const t=wType.value;
  document.getElementById("wMcFields").classList.toggle("hidden",t!=="mc");
  document.getElementById("wTfFields").classList.toggle("hidden",t!=="tf");
  document.getElementById("wSaFields").classList.toggle("hidden",t!=="sa");
}
function saveQ(){
  const t=wType.value;
  const q={type:t,q:wQ.value.trim(),pts:+wPts.value||100,timer:+wTimer.value||30,sent:false};
  if(!q.q) return alert("Enter the question prompt.");
  if(t==="mc"){
    q.opts=[wA.value,wB.value,wC.value,wD.value]; q.correct=wCorrect.value;
    if(q.opts.some(o=>!o.trim())) return alert("Fill all four options.");
  } else if(t==="tf"){ q.correct=wTfCorrect.value; q.opts=["TRUE","FALSE"]; }
  else { q.correct=wSa.value.trim().toLowerCase(); if(!q.correct) return alert("Enter accepted answer."); }
  const bank=store.bank;
  if(editingIdx!==null) bank[editingIdx]=q; else bank.push(q);
  store.bank=bank; closeModal(); renderBank();
}
function closeModal(){ document.getElementById("modal").classList.add("hidden"); editingIdx=null; }
function pushQ(i){
  const bank=store.bank; bank[i].sent=true; store.bank=bank; store.reveal=false;
  store.live={...bank[i], startedAt:Date.now()}; emit(); renderBank();
}
function revealAnswer(){ store.reveal=true; emit(); }
function deleteQ(i){ if(confirm("Delete this question?")){ const b=store.bank; b.splice(i,1); store.bank=b; renderBank(); } }
function wipeAll(){ if(confirm("Wipe grid & ALL storage memory?")){ store.bank=[]; store.live=null; store.reveal=false; emit(); renderBank(); } }
function toggleFS(){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }

/* right-click card: push live or delete (replaces old push/reveal/delete buttons) */
document.getElementById("bank").addEventListener("contextmenu",e=>{
  const card=e.target.closest(".qcard"); if(!card) return;
  e.preventDefault(); const i=[...card.parentNode.children].indexOf(card);
  confirm("OK = Push LIVE to players\nCancel = Delete question") ? pushQ(i) : deleteQ(i);
});

/* ============ PLAYER ============ */
let myLocked=false;
function renderLive(){
  const live=store.live;
  if(!live){ document.getElementById("qPanel").classList.add("hidden");
    document.getElementById("pStatus").textContent="⏳ WAITING FOR QUESTION..."; return; }
  document.getElementById("qPanel").classList.remove("hidden");
  document.getElementById("pStatus").textContent = store.reveal ? "✔ VERIFIED SOLUTION REVEALED" : "📝 QUESTION LIVE — ANSWER NOW!";
  document.getElementById("pType").textContent = TYPE_LABEL[live.type].toUpperCase();
  document.getElementById("pQ").textContent = live.q;
  myLocked = myLocked || store.reveal;
  /* --- adaptive interface per question type --- */
  if(live.type==="mc"){
    const box=document.getElementById("pMc"); box.classList.remove("hidden");
    document.getElementById("pTf").classList.add("hidden");
    document.getElementById("pSa").classList.add("hidden");
    box.innerHTML = live.opts.map((o,i)=>
      `<button class="opt" data-k="${"ABCD"[i]}" onclick="lockMc(this)" ${myLocked?"disabled":""}><b>${"ABCD"[i]}.</b> ${esc(o)}</button>`).join("");
  } else if(live.type==="tf"){
    document.getElementById("pMc").classList.add("hidden");
    document.getElementById("pTf").classList.remove("hidden");
    document.getElementById("pSa").classList.add("hidden");
    document.querySelectorAll("#pTf .opt").forEach(b=>b.disabled=myLocked);
  } else {
    document.getElementById("pMc").classList.add("hidden");
    document.getElementById("pTf").classList.add("hidden");
    document.getElementById("pSa").classList.remove("hidden");
    document.getElementById("saInput").disabled=myLocked;
  }
  if(store.reveal) showFeedback();
}
function lockMc(btn){
  if(myLocked||store.reveal) return;
  myLocked=true; btn.classList.add("sel");
  document.querySelectorAll("#pMc .opt").forEach(b=>b.disabled=true);
  setStatus("🔒 CHOICE LOCKED IN — waiting for host to reveal verified solution...");
}
function lockTf(v){
  if(myLocked||store.reveal) return;
  myLocked=true;
  document.querySelectorAll("#pTf .opt").forEach(b=>{b.disabled=true; if(b.textContent===v.toUpperCase()) b.classList.add("sel");});
  setStatus("🔒 CHOICE LOCKED IN — waiting for host to reveal verified solution...");
}
function lockSa(){
  if(myLocked||store.reveal) return;
  const v=document.getElementById("saInput").value.trim();
  if(!v) return alert("Type an answer first.");
  myLocked=true; document.getElementById("saInput").disabled=true;
  sessionStorage.setItem("quiz_sa", v.toLowerCase());
  setStatus("🔒 ANSWER LOCKED IN — waiting for host to reveal verified solution...");
}
function setStatus(s){ document.getElementById("pStatus").textContent=s; }
function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
function showFeedback(){
  const live=store.live; if(!live) return;
  const fb=document.getElementById("pFeedback"), box=document.getElementById("fbBox");
  fb.classList.remove("hidden");
  let correctTxt, myCorrect=false;
  if(live.type==="mc"){
    correctTxt=`Correct Answer: <b>${live.correct}. ${esc(live.opts["ABCD".indexOf(live.correct)])}</b>`;
    document.querySelectorAll("#pMc .opt").forEach(b=>{
      b.disabled=true;
      if(b.dataset.k===live.correct) b.classList.add("correct");
      else if(b.classList.contains("sel")) b.classList.add("wrong");
    });
    const sel=document.querySelector("#pMc .opt.sel");
    myCorrect = sel && sel.dataset.k===live.correct;
  } else if(live.type==="tf"){
    correctTxt=`Correct Answer: <b>${live.correct.toUpperCase()}</b>`;
    document.querySelectorAll("#pTf .opt").forEach(b=>{
      b.disabled=true;
      if(b.textContent===live.correct.toUpperCase()) b.classList.add("correct");
    });
  } else {
    correctTxt=`Correct Answer: <b>${esc(live.correct)}</b>`;
    myCorrect = sessionStorage.getItem("quiz_sa")===live.correct;
  }
  box.innerHTML = `<h3>${myCorrect?"✅ Correct!":"❌ Incorrect"}</h3><p style="margin:4px 0 0">${correctTxt}</p>`;
  if(myCorrect) document.getElementById("pPts").textContent = +document.getElementById("pPts").textContent + live.pts;
}
/* timer */
setInterval(()=>{
  const live=store.live, tEl=document.getElementById("pTimer");
  if(!live){ if(role==="player") tEl.textContent="--"; return; }
  const left=Math.max(0, live.timer - Math.floor((Date.now()-live.startedAt)/1000));
  if(role==="player") tEl.textContent = left+"s";
  if(left===0 && role==="player") document.querySelectorAll(".opt,#saInput").forEach(e=>e.disabled=true);
},400);
window.addEventListener("storage",e=>{
  if(e.key==="quiz_live"||e.key==="quiz_reveal"){
    if(role==="admin") renderBank();
    if(role==="player" && e.key==="quiz_reveal" && e.newValue==="1"){ myLocked=true; showFeedback(); }
    else if(role==="player" && e.key==="quiz_live"){
      myLocked=false; sessionStorage.removeItem("quiz_sa");
      document.getElementById("pFeedback").classList.add("hidden"); renderLive();
    }
  }
});
</script>
</body>
</html>
